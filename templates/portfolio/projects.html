{% extends "portfolio/base.html" %}
{% load static %}

{% block content %}

<div class="portfolio-page">

    <section class="portfolio-section">

        <div class="section-top">
            <div>
                <span class="section-label">03 / SELECTED WORKS</span>
                <h2>Мої <span class="gradient-text">проєкти.</span></h2>
            </div>
        </div>

        <div class="work-grid">

            <!-- ПРОЄКТ 1 -->
            <div class="work-card">

                <div class="work-top">
                    <span class="work-type">WEB DEVELOPMENT</span>
                    <span class="work-arrow">✦</span>
                </div>

                <div class="work-art">
                    <img
                        src="{% static 'images/project1.png' %}"
                        alt="Проєкт NAMELAKA"
                        class="work-project-image"
                    >
                </div>

                <h3>NAMELAKA</h3>

                <p>Вебпроєкт для компанії</p>

                <div class="work-tags">
                    <span>Python</span>
                    <span>Django</span>
                </div>

            </div>


            <!-- ПРОЄКТ 2 -->
            <div class="work-card">

                <div class="work-top">
                    <span class="work-type">GAME DEVELOPMENT</span>
                    <span class="work-arrow">✦</span>
                </div>

                <div class="work-art">
                    <img
                        src="{% static 'images/project2.png' %}"
                        alt="Ігровий проєкт"
                        class="work-project-image"
                    >
                </div>

                <h3>Ігрові проєкти</h3>

                <p>Власні ігри та ігрові механіки</p>

                <div class="work-tags">
                    <span>Pygame</span>
                    <span>Godot</span>
                </div>

            </div>

        </div>

    </section>

</div>

{% endblock %}
