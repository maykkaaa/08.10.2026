{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Моє IT-резюме{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"

        </button>

        <nav class="collapse navbar-collapse" id="navbarNav">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">Резюме</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'projects' %}">Проєкти</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'skills' %}">Навички</a>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

    <div class="container">
        <p class="mb-1">Майя Черватюк | Майбутня розробниця</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
